version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file: ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ../src:/app/src
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - redis
    links:
      - redis

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python -m arq src.pipeline.worker.WorkerSettings
    env_file: ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ../src:/app/src
    depends_on:
      - redis
    links:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
