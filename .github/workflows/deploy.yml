name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
      - feature/run-ci-cd
  pull_request:
    branches:
      - main

env:
  PROJECT_ID: cardly-project-497102
  GAR_LOCATION: asia-southeast1
  REPOSITORY: cardly-backend-repo
  SERVICE: cardly-backend
  REGION: asia-southeast1

jobs:
  deploy:
    permissions:
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Bắt tay bảo mật không mật khẩu OIDC với Google Cloud
      - name: Authenticate with Google Cloud via OIDC
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      # 2. ĐĂNG NHẬP DOCKER: Đảm bảo điền đúng domain repo của bạn mình
      - name: Docker Auth
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # 3. Build and Push Container: Thay vì viết cứng, hãy để biến env tự vận hành cho linh hoạt
      - name: Build and Push Container
        run: |
          docker build -f docker/Dockerfile -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }} .
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
      # 4. Triển khai lên Cloud Run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: asia-southeast1-docker.pkg.dev/cardly-devops/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
          flags: '--allow-unauthenticated'
          env_vars: |
            ENVIRONMENT=staging
            APP_VERSION=1.0.0
            MONGODB_URL=${{ secrets.MONGODB_URL }}
            REDIS_URL=redis://localhost:6379/0
            CORS_ORIGINS=["*"]
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ALG=HS256
            JWT_EXP=15
            REFRESH_TOKEN_EXP=7
            OTP_EXP_MINUTES=10
            SMTP_HOST=smtp.gmail.com
            SMTP_PORT=587
            SMTP_USER=nonamegamingok@gmail.com
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            EMAIL_FROM=nonamegamingok@gmail.com
            EMAIL_FROM_NAME=cardly
            MAX_SIZE_MB=10
            STORAGE_PATH=/tmp/ocr_uploads
            MIN_DPI=300
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            OCR_ENGINE=gemini
            HIGH_THRESHOLD=0.95
            LOW_THRESHOLD=0.70
          secrets: |
            GOOGLE_SERVICE_ACCOUNT_JSON=GOOGLE_SERVICE_ACCOUNT_JSON:latest
